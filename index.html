<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header>
        <form id="search-form">
            <input id="search-input" type="search">
            <button>Buscar</button>
        </form>
        <select id="category-select">
            <option value="">Todas las categorías</option>
        </select>
    </header>
    <main>
        <div id="status-message"></div>
        <form id="create-product-form">
            <input id="product-title" type="text" placeholder="Titulo">
            <input id="product-price" type="number" placeholder="Precio">
            <input id="product-category" type="text" placeholder="Categoria">
            <input id="product-description" type="text" placeholder="Descripcion">
            <button type="submit">Crear producto</button>
        </form>
        <section id="products-container" class="grid grid-cols-1 
        sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 p-4">
        </section>
        <nav id="pagination">
            <button class="nav-button" id="prev-btn">
                <svg class="w-6 h-6 text-gray-800 dark:text-white" 
                aria-hidden="true" xmlns="http://www.w3.org/2000/svg" 
                fill="none" viewBox="0 0 8 14">
                    <path stroke="currentColor" stroke-linecap="round" 
                    stroke-linejoin="round" 
                    stroke-width="2" d="M7 1 1.3 6.326a.91.91 0 0 0 0 1.348L7 13"/>
                </svg>
            </button>
            <span id="page-info"></span>
            <button class="nav-button" id="next-btn">
                <svg class="w-6 h-6 text-gray-800 dark:text-white" 
                aria-hidden="true" xmlns="http://www.w3.org/2000/svg" 
                fill="none" viewBox="0 0 8 14">
                    <path stroke="currentColor" 
                    stroke-linecap="round" 
                    stroke-linejoin="round" stroke-width="2" d="m1 13 5.7-5.326a.909.909 0 0 0 0-1.348L1 1"/>
                </svg>
            </button>
        </nav>
        <aside>
            <span id="cart-count">0</span>
            <button id="send-cart-btn">Enviar carrito</button>
        </aside>
    </main>
    <footer></footer>
    <script src="script.js" type="module" defer></script>
</body>
</html>
